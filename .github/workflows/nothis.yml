# NoThis browser extension, built from extension/src/ (which also generates declickbait.user.js).
# Every push and pull request: build the Chrome/Edge and Firefox zips and lint the Firefox build.
# Tags nothis-v<version>: also archive the Safari apps, upload them to TestFlight, and publish a
# GitHub release with the Chrome/Edge and Firefox zips.
# Release: bump "version" in extension/package.json, run node extension/build.mjs, commit, then
#   git tag nothis-v1.12.0 && git push origin nothis-v1.12.0
# A new build of a version already in TestFlight keeps the version and adds a suffix,
#   git tag nothis-v1.12.0-2 && git push origin nothis-v1.12.0-2
# so external testers get it without a new Beta App Review (Apple reviews each new version once).
# Secrets for the upload: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (see extension/README.md).
name: NoThis extension

on:
  push:
    branches: ['**']
    tags: ['nothis-v*']
    paths: ['extension/**', 'declickbait.user.js', '.github/workflows/nothis.yml']
  pull_request:
    paths: ['extension/**', 'declickbait.user.js', '.github/workflows/nothis.yml']
  workflow_dispatch:

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build Chrome/Edge, Firefox and the userscript
        run: node extension/build.mjs chrome firefox userscript
      - name: Check script syntax
        run: |
          node --check extension/dist/chrome/nothis.js
          node --check declickbait.user.js
          for f in extension/src/*.js; do node --check "$f"; done
      - name: Check the committed userscript is up to date
        run: |
          git diff --exit-code declickbait.user.js || { echo "::error::declickbait.user.js is generated: run node extension/build.mjs and commit the result"; exit 1; }
      - name: Lint Firefox build
        run: npx --yes web-ext@8 lint --source-dir extension/dist/firefox
      - uses: actions/upload-artifact@v7
        with:
          name: nothis-zips
          path: extension/dist/*.zip

  testflight:
    name: Upload to TestFlight
    if: startsWith(github.ref, 'refs/tags/nothis-v')
    needs: build
    # Xcode 27 image (public preview); its default Xcode 27.1 is the version the project is made with.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check tag matches the version
        run: |
          v=$(node -p "require('./extension/package.json').version")
          case "$GITHUB_REF_NAME" in
            "nothis-v$v" | "nothis-v$v"-[0-9]*) ;; # nothis-v1.20.0, or a rebuild nothis-v1.20.0-2
            *) echo "::error::Tag $GITHUB_REF_NAME does not match version $v in extension/package.json"; exit 1 ;;
          esac
          fi
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
      # Every runner makes a new development certificate to archive with; Apple allows about ten.
      # Revoke the ones earlier runs left behind, and this run's own when it is done.
      - name: Revoke old CI development certificates
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node extension/safari/revoke-ci-certs.mjs
      - name: Archive and upload iOS and macOS
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: extension/safari/release.sh
      - name: Revoke this run's development certificate
        if: always()
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node extension/safari/revoke-ci-certs.mjs
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/nothis-v')
    needs: testflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nothis-zips
      - name: Publish release with the zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nothis-*.zip -R "$GITHUB_REPOSITORY" --title "NoThis ${GITHUB_REF_NAME#nothis-v}" --generate-notes
