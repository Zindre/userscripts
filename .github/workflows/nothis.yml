# NoThis browser extension (extension/, built from declickbait.user.js).
# Every push and pull request: build the Chrome/Edge and Firefox zips and lint the Firefox build.
# Tags nothis-v<version>: also archive the Safari apps, upload them to TestFlight, and publish a
# GitHub release with the Chrome/Edge and Firefox zips.
# Release: bump @version in declickbait.user.js, commit, then
#   git tag nothis-v1.12.0 && git push origin nothis-v1.12.0
# Secrets for the upload: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (see extension/README.md).
name: NoThis extension

on:
  push:
    branches: ['**']
    tags: ['nothis-v*']
    paths: ['extension/**', 'declickbait.user.js', '.github/workflows/nothis.yml']
  pull_request:
    paths: ['extension/**', 'declickbait.user.js', '.github/workflows/nothis.yml']
  workflow_dispatch:

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check script syntax
        run: |
          node --check declickbait.user.js
          for f in extension/src/*.js; do node --check "$f"; done
      - name: Build Chrome/Edge and Firefox
        run: node extension/build.mjs chrome firefox
      - name: Lint Firefox build
        run: npx --yes web-ext@8 lint --source-dir extension/dist/firefox
      - uses: actions/upload-artifact@v7
        with:
          name: nothis-zips
          path: extension/dist/*.zip

  testflight:
    name: Upload to TestFlight
    if: startsWith(github.ref, 'refs/tags/nothis-v')
    needs: build
    # Xcode 27 image (public preview); its default Xcode 27.1 is the version the project is made with.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check tag matches @version
        run: |
          v=$(sed -nE 's#^// @version +([^ ]+).*#\1#p' declickbait.user.js)
          if [ "nothis-v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match @version $v in declickbait.user.js"; exit 1
          fi
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Archive and upload iOS and macOS
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: extension/safari/release.sh
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/nothis-v')
    needs: testflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nothis-zips
      - name: Publish release with the zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nothis-*.zip -R "$GITHUB_REPOSITORY" --title "NoThis ${GITHUB_REF_NAME#nothis-v}" --generate-notes
